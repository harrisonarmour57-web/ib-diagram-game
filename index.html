<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shift Happens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* diagrams */
.dg { display: grid; gap: 10px; }
.dg.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.dg.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 560px) { .dg.n2, .dg.n3 { grid-template-columns: 1fr; } }
.pn { margin: 0; min-width: 0; }
.pn figcaption { font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 2px 8px; }
.dgs { width: 100%; height: auto; display: block; overflow: visible; font-family: var(--f-body); }
.dgs .axis { fill: none; stroke: var(--ink); stroke-width: 1.8; }
.dgs .grid { stroke: var(--grid); stroke-width: 1; }
.dgs .cv { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.dgs .cv.thin { stroke-width: 1.6; }
.dgs .cv.dash { stroke-dasharray: 7 5; }
.dgs .gd { fill: none; stroke: var(--muted); stroke-width: 1.1; stroke-dasharray: 4 4; }
.dgs .br { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.dgs .aw { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.dgs .ahp { fill: var(--ink); }
.dgs .dt { fill: var(--ink); }
.dgs .bx { fill: var(--card); stroke: var(--ink); stroke-width: 1.5; }
.dgs .bx.b-m { fill: var(--paper); stroke-dasharray: 5 3; }
.dgs .ar { stroke: none; }
.s-k { stroke: var(--ink); } .s-d { stroke: var(--cd); } .s-s { stroke: var(--cs); } .s-x { stroke: var(--cx); } .s-g { stroke: var(--cg); } .s-m { stroke: var(--cm); }
.a-cs { fill: var(--a-cs); } .a-ps { fill: var(--a-ps); } .a-wl { fill: var(--a-wl); } .a-gv { fill: var(--a-gv); } .a-pr { fill: var(--a-pr); } .a-ls { fill: var(--a-ls); }
.dgs text { fill: var(--ink); font-size: 13.5px; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
.dgs .lb { font-weight: 700; }
.dgs .t-k { fill: var(--ink); } .dgs .t-d { fill: var(--cd); } .dgs .t-s { fill: var(--cs); } .dgs .t-x { fill: var(--cx); } .dgs .t-g { fill: var(--cg); } .dgs .t-m { fill: var(--cm); }
.dgs .al { fill: var(--ink); font-size: 12.5px; }
.dgs .tk, .dgs .tk2 { font-size: 12.5px; fill: var(--muted); font-family: var(--f-mono); }
.dgs .tk2 { fill: var(--ink); font-family: var(--f-body); font-weight: 700; }
.dgs .axl { font-size: 13px; font-weight: 700; }
.dgs .tx.sm { font-size: 11.5px; fill: var(--muted); font-weight: 400; }
.dgs .tx { font-weight: 700; }
.dgs .bt { font-weight: 700; font-size: 13px; stroke: var(--card); }
.dgs .bl { font-weight: 700; font-size: 12.5px; }
.dgs .fl { font-weight: 700; font-size: 12.5px; }
/* blanks in Label mode */
.dgs .slot { cursor: pointer; }
.dgs .slot rect { fill: var(--card); stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 4 3; }
.dgs .slot text { fill: var(--accent); font: 700 12.5px var(--f-mono); stroke: none; }
.dgs .slot.filled rect { stroke-dasharray: none; }
.dgs .slot.filled text { font-family: var(--f-body); fill: var(--ink); }
.dgs .slot.active rect { fill: var(--mark); stroke: var(--ink); }
.dgs .slot.ok rect { fill: var(--ok-bg); stroke: var(--ok); }
.dgs .slot.bad rect { fill: var(--bad-bg); stroke: var(--bad); }
.dgs .slot:focus { outline: none; } .dgs .slot:focus-visible rect { stroke-width: 3; }


/* Layout: an arcade run on graph paper. Scoreboard HUD on top, then a timer fuse, then the round:
   prompt + controls beside the diagram board (stacked on phones). Home = title, level switch, four worlds. */
:root {
  --bg: #edf1f7;            /* graph paper */
  --grid: #dbe3ef;          /* paper rule (also used by diagram ticks) */
  --paper: #ffffff;         /* diagram board */
  --card: #ffffff;
  --ink: #142038;
  --muted: #55627b;
  --line: #ccd5e3;
  --accent: #e0452a;        /* tomato: actions, hearts, the "shift" */
  --accent-ink: #ffffff;
  --mark: #ffc83a;          /* streak gold */
  --mark-ink: #2a1d00;
  --ok: #11774a; --ok-bg: #dcf2e6;
  --bad: #be2a1f; --bad-bg: #fde3df;
  --hunt: rgba(20, 32, 56, .07); --hunt-hi: rgba(224, 69, 42, .28);
  --cd: #2457c5; --cs: #cc4424; --cx: #7a3bbd; --cg: #0f7a63; --cm: #b9770b;
  --a-cs: rgba(36, 87, 197, .16); --a-ps: rgba(204, 68, 36, .15); --a-wl: rgba(240, 170, 20, .42); --a-gv: rgba(122, 59, 189, .16); --a-pr: rgba(15, 122, 99, .2); --a-ls: rgba(179, 38, 30, .2);
  --f-display: "Bungee", "Arial Black", Impact, system-ui, sans-serif;
  --f-body: "Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1526; --grid: #1d2944; --paper: #131c30; --card: #18233b; --ink: #e9eef8; --muted: #9ba7c0; --line: #2a3a5c;
    --accent: #ff7558; --accent-ink: #210904; --mark: #f5c241; --mark-ink: #251900;
    --ok: #5fd39a; --ok-bg: #12321f; --bad: #ff8a80; --bad-bg: #3a1716;
    --hunt: rgba(233, 238, 248, .07); --hunt-hi: rgba(255, 117, 88, .32);
    --cd: #7ea8ff; --cs: #ff8a6b; --cx: #c39bff; --cg: #4fd1b0; --cm: #f2b84b;
    --a-cs: rgba(126, 168, 255, .2); --a-ps: rgba(255, 138, 107, .18); --a-wl: rgba(242, 184, 75, .38); --a-gv: rgba(195, 155, 255, .2); --a-pr: rgba(79, 209, 176, .2); --a-ls: rgba(255, 138, 128, .22);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1526; --grid: #1d2944; --paper: #131c30; --card: #18233b; --ink: #e9eef8; --muted: #9ba7c0; --line: #2a3a5c;
  --accent: #ff7558; --accent-ink: #210904; --mark: #f5c241; --mark-ink: #251900;
  --ok: #5fd39a; --ok-bg: #12321f; --bad: #ff8a80; --bad-bg: #3a1716;
  --hunt: rgba(233, 238, 248, .07); --hunt-hi: rgba(255, 117, 88, .32);
  --cd: #7ea8ff; --cs: #ff8a6b; --cx: #c39bff; --cg: #4fd1b0; --cm: #f2b84b;
  --a-cs: rgba(126, 168, 255, .2); --a-ps: rgba(255, 138, 107, .18); --a-wl: rgba(242, 184, 75, .38); --a-gv: rgba(195, 155, 255, .2); --a-pr: rgba(79, 209, 176, .2); --a-ls: rgba(255, 138, 128, .22);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; }
h1, h2, h3 { text-wrap: balance; }

/* buttons */
.btn { border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 11px 18px; cursor: pointer; box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 55%, #000); transition: transform .08s; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); box-shadow: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- HOME ---------- */
.home { display: grid; gap: 26px; padding-block: 34px 10px; }
.title { display: grid; gap: 10px; }
.title h1 { font: 400 clamp(44px, 10vw, 92px)/.9 var(--f-display); margin: 0; letter-spacing: -.01em; }
.title h1 .shift { display: inline-block; color: var(--accent); animation: nudge 3.2s ease-in-out infinite; }
@keyframes nudge { 0%, 55%, 100% { transform: translateX(0); } 65%, 85% { transform: translateX(.18em); } }
.title p { margin: 0; color: var(--muted); max-width: 60ch; font-size: 17px; }
.title p b { color: var(--ink); }
.picker { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.flab { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card); gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.picker .hint { font-size: 14px; color: var(--muted); }
.worlds { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.world { position: relative; text-align: left; border: 2px solid var(--ink); background: var(--card); border-radius: var(--r); padding: 16px 16px 14px; cursor: pointer; display: grid; gap: 8px; box-shadow: 4px 4px 0 var(--ink); transition: transform .1s, box-shadow .1s; min-width: 0; }
.world:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
.world:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
.world .wn { font: 400 24px/1 var(--f-display); }
.world .wb { font-size: 14px; color: var(--muted); }
.world .wf { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1.5px dashed var(--line); padding-top: 8px; font-size: 14px; }
.world .wf b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.stars { display: inline-flex; gap: 2px; }
.stars svg { width: 18px; height: 18px; }
.stars .on { fill: var(--mark); stroke: var(--mark-ink); }
.stars .off { fill: none; stroke: var(--line); }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; }
.rules li { background: color-mix(in srgb, var(--card) 85%, transparent); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
.rules li b { display: block; color: var(--ink); font-size: 15px; }
.rules li .tag { font: 700 11px var(--f-mono); color: var(--accent); margin-left: 6px; letter-spacing: .05em; }
.basics { font-size: 14px; color: var(--muted); margin: 0; max-width: 75ch; }
.foot { font-size: 13px; color: var(--muted); border-top: 1.5px solid var(--line); padding-top: 14px; }
.foot a { color: var(--ink); }

/* home: step headings, game-mode picker */
.step { display: grid; gap: 12px; }
.step h2 { margin: 0; display: flex; align-items: center; gap: 10px; font: 400 18px/1.1 var(--f-display); }
.step h2 span { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 14px; }
.modepick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .modepick { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .modepick { grid-template-columns: minmax(0, 1fr); } }
.mode { text-align: left; display: grid; gap: 2px; align-content: start; background: color-mix(in srgb, var(--card) 85%, transparent); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--muted); cursor: pointer; min-width: 0; }
.mode { position: relative; padding-right: 40px; }
.mode b { display: block; color: var(--ink); font-size: 15px; }
.mode .tick { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); background: var(--card); }
.mode[aria-pressed="true"] .tick { border-color: var(--ink); background: var(--ink); }
.mode[aria-pressed="true"] .tick::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid var(--mark); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.btn.small { padding: 5px 12px; font-size: 13px; }
.mode .tag { font: 700 11px var(--f-mono); color: var(--accent); margin-left: 6px; letter-spacing: .05em; }
.mode:hover { border-color: var(--ink); }
.mode[aria-pressed="true"] { border-color: var(--ink); background: var(--mark); color: var(--mark-ink); box-shadow: 3px 3px 0 var(--ink); }
.mode[aria-pressed="true"] b, .mode[aria-pressed="true"] .tag { color: var(--mark-ink); }
.world:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }

/* ---------- HUD ---------- */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 0; }
.hud-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 8px 14px; }
.hud .logo { font: 400 15px/1 var(--f-display); margin-right: auto; }
.hud .logo span { color: var(--accent); }
@media (max-width: 600px) { .hud .logo { display: none; } .hud-in { justify-content: space-between; } }
.stat { display: grid; line-height: 1.05; }
.stat small { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; opacity: .7; font-weight: 700; }
.stat b { font: 400 20px/1.1 var(--f-display); font-variant-numeric: tabular-nums; position: relative; }
.stat em { font-style: normal; font: 700 12px var(--f-mono); background: var(--mark); color: var(--mark-ink); padding: 1px 5px; border-radius: 6px; margin-left: 4px; vertical-align: 3px; }
.lives { display: inline-flex; gap: 3px; }
.lives svg { width: 20px; height: 20px; }
.lives .on { fill: var(--accent); }
.lives .off { fill: none; stroke: color-mix(in srgb, var(--bg) 45%, transparent); stroke-width: 2; }
.lives .lost { animation: lose .5s ease-out; }
@keyframes lose { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
.hud .end { background: transparent; border: 1.5px solid color-mix(in srgb, var(--bg) 40%, transparent); color: var(--bg); border-radius: 9px; padding: 4px 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
.pop { position: absolute; left: 0; top: -4px; font: 400 16px var(--f-display); color: var(--mark); pointer-events: none; animation: rise 1s ease-out forwards; white-space: nowrap; }
@keyframes rise { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-26px); } }
.fuse { height: 8px; background: var(--card); border: 1.5px solid var(--ink); border-radius: 99px; margin-top: 10px; overflow: hidden; }
.fuse i { display: block; height: 100%; width: 100%; background: var(--ink); border-radius: 99px; transform-origin: left; }
.fuse.low i { background: var(--accent); }
.fuse.paused i { opacity: .35; }

/* ---------- ROUND ---------- */
.play { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-areas: "board prompt" "board ctrl"; grid-template-rows: auto 1fr; gap: 14px 22px; margin-top: 16px; align-items: start; }
.prompt { grid-area: prompt; min-width: 0; }
.ctrl { grid-area: ctrl; min-width: 0; display: grid; gap: 12px; align-content: start; }
.board { grid-area: board; min-width: 0; background: var(--paper); border: 2px solid var(--ink); border-radius: var(--r); padding: 12px; box-shadow: 4px 4px 0 var(--ink); position: relative; }
@media (max-width: 760px) {
  .play { grid-template-columns: minmax(0, 1fr); grid-template-areas: "prompt" "board" "ctrl"; }
}
.eyebrow { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 700; }
.eyebrow .rt { font: 400 13px var(--f-display); color: var(--accent); }
.chip { font: 700 11px var(--f-mono); padding: 2px 7px; border-radius: 6px; border: 1.5px solid var(--line); color: var(--muted); }
.chip.hl { border-color: var(--cx); color: var(--cx); }
.prompt h2 { font-size: clamp(19px, 2.6vw, 24px); line-height: 1.3; margin: 0 0 6px; }
.prompt .ctx { margin: 0 0 4px; font-weight: 700; color: var(--muted); font-size: 14px; }
.prompt .how { margin: 0; color: var(--muted); font-size: 14px; }
.prompt .calcp { font-size: 16px; }
.target { background: var(--mark); color: var(--mark-ink); padding: 0 6px; border-radius: 6px; }

.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: center; text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; cursor: pointer; font-weight: 600; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt .k { flex: 0 0 auto; font: 700 12px var(--f-mono); width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; background: var(--bg); color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--ink); background: var(--mark); color: var(--mark-ink); }
.opt[aria-pressed="true"] .k { background: var(--ink); color: var(--bg); }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ink); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--ink); }
.opt:disabled { cursor: default; }

/* shift: draggable board + nudge buttons */
.board.drag { touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.board.drag.grabbing { cursor: grabbing; }
.board .hint { position: absolute; right: 14px; bottom: 10px; font: 700 12px var(--f-mono); color: var(--muted); pointer-events: none; }
.nudges { display: flex; flex-wrap: wrap; gap: 8px; }
.nudge { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); overflow: hidden; }
.nudge span { padding: 0 8px; font-weight: 700; font-size: 14px; }
.nudge button { border: 0; background: transparent; padding: 6px 10px; cursor: pointer; font-weight: 700; }
.nudge button:hover { background: var(--bg); }
.nudge.on { border-color: var(--ink); background: var(--mark); color: var(--mark-ink); }
.qlab { font-size: 14px; font-weight: 700; margin: 0; }
.qlab.off { color: var(--muted); font-weight: 400; }

/* label drop chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.tok { border: 2px solid var(--ink); background: var(--card); border-radius: 999px; padding: 6px 14px; cursor: grab; font-weight: 700; touch-action: none; user-select: none; -webkit-user-select: none; }
.tok.used { opacity: .35; border-style: dashed; }
.tok sub { font-size: .72em; }
.ghost-tok { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -60%) rotate(-3deg); box-shadow: 3px 3px 0 var(--ink); background: var(--mark); color: var(--mark-ink); }
.dgs .slot rect { stroke: var(--ink) !important; }
.dgs .slot.hover rect { fill: var(--mark); }

/* hunt the area */
.hunt .dgs .ar { fill: var(--hunt); stroke: color-mix(in srgb, var(--ink) 30%, transparent); stroke-width: 1; stroke-dasharray: 3 3; cursor: crosshair; transition: fill .12s; }
.hunt .dgs .ar:hover { fill: var(--hunt-hi); }
.hunt .dgs text, .hunt .dgs .cv, .hunt .dgs .gd, .hunt .dgs .dt { pointer-events: none; }

/* calc */
.num { width: 9em; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--ink); background: var(--card); font: 700 18px var(--f-mono); }
.work { font: 13.5px/1.6 var(--f-mono); margin-top: 6px; }

/* feedback */
.fb { border-radius: 14px; padding: 12px 14px; border: 2px solid; display: grid; gap: 4px; animation: pop .2s ease-out; }
.fb.ok { background: var(--ok-bg); border-color: var(--ok); }
.fb.bad { background: var(--bad-bg); border-color: var(--bad); }
.fb .big { font: 400 22px/1 var(--f-display); }
.fb.ok .big { color: var(--ok); } .fb.bad .big { color: var(--bad); }
.fb p { margin: 0; font-size: 15px; }
.fb .tip { color: var(--muted); font-size: 14px; }
@keyframes pop { from { transform: scale(.97); opacity: .4; } to { transform: none; opacity: 1; } }
.toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 60; background: var(--mark); color: var(--mark-ink); border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); border-radius: 16px; padding: 14px 22px; text-align: center; font: 400 clamp(22px, 5vw, 34px)/1.1 var(--f-display); pointer-events: none; animation: toast 1.6s ease-out forwards; max-width: calc(100vw - 32px); }
.toast small { display: block; font: 700 14px var(--f-body); margin-top: 4px; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%); } }

/* ---------- GAME OVER ---------- */
.over { display: grid; gap: 20px; padding-block: 30px 10px; }
.over h1 { font: 400 clamp(40px, 9vw, 76px)/.95 var(--f-display); margin: 0; }
.over .newbest { display: inline-block; background: var(--mark); color: var(--mark-ink); font: 400 15px var(--f-display); padding: 4px 10px; border-radius: 8px; transform: rotate(-2deg); }
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tally div { background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 14px; }
.tally small { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.tally b { font: 400 26px var(--f-display); font-variant-numeric: tabular-nums; }
.review { display: grid; gap: 8px; }
.review h2 { margin: 0; font-size: 20px; }
.review ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.review li { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.review li b { display: block; }
.review li span { font-size: 14px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

</style>
</head>
<body>
<div class="app">
  <header class="hud" id="hud" hidden></header>
  <main id="main"></main>
</div>
<script>
/* ---------- Diagram engine: data space 0..100 on both axes, drawn as SVG ---------- */
const DG = (() => {
  const W = 360, H = 312, PX = 58, PY = 262, PW = 280, PH = 228;
  let mx = 100, my = 100, zy = 0;               // per-panel scale + x-axis position
  const X = x => PX + x * PW / mx, Y = y => PY - y * PH / my;
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // "P_w + t" -> P with subscript w, then " + t" back on the baseline
  const fmt = s => {
    const parts = String(s).split(/_([^\s]+)/);
    let out = '', low = false;
    parts.forEach((p, i) => {
      if (!p) return;
      if (i % 2) { out += `<tspan dy="${low ? 0 : 4}" font-size="0.74em">${esc(p)}</tspan>`; low = true; }
      else { out += low ? `<tspan dy="-4">${esc(p)}</tspan>` : esc(p); low = false; }
    });
    return out;
  };
  const html = s => esc(s).replace(/_([^\s]+)/g, '<sub>$1</sub>');
  // Labels that carry no concept on their own (P1, Q2, e1, A...) are not quizzed.
  const GENERIC = /^(P|Q|e|W|Y|PL|ER|i|r|L|X|AC|C)_?[0-9]'?$|^[A-F]$|^0$/;

  /* ---- geometry helpers ---- */
  const seg = (x1, y1, x2, y2) => ({ p: [[x1, y1], [x2, y2]] });
  const yAt = (s, x) => { const [[a, b], [c, d]] = s.p; return b + (d - b) * (x - a) / (c - a); };
  const xAt = (s, y) => { const [[a, b], [c, d]] = s.p; return a + (c - a) * (y - b) / (d - b); };
  const ix = (s, t) => {
    const [[x1, y1], [x2, y2]] = s.p, [[x3, y3], [x4, y4]] = t.p;
    const den = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
    const a = x1 * y2 - y1 * x2, b = x3 * y4 - y3 * x4;
    return [(a * (x3 - x4) - (x1 - x2) * b) / den, (a * (y3 - y4) - (y1 - y2) * b) / den];
  };
  const mv = (s, dx, dy) => seg(s.p[0][0] + dx, s.p[0][1] + dy, s.p[1][0] + dx, s.p[1][1] + dy);
  const solve = (f, lo, hi) => { for (let k = 0; k < 60; k++) { const m = (lo + hi) / 2; (f(lo) * f(m) <= 0) ? hi = m : lo = m; } return (lo + hi) / 2; };

  /* ---- element constructors ---- */
  const L = (s, lab, c = 'k', o = {}) => ({ k: 'line', pts: s.p, lab, c, ...o });
  const F = (fn, x0, x1, lab, c = 'k', o = {}) => {
    const pts = []; const n = 60;
    for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n; const y = fn(x); if (y <= (o.ymax ?? 99) && y >= (o.ymin ?? -1e9)) pts.push([x, y]); }
    return { k: 'line', pts, lab, c, ...o };
  };
  const P = (pts, lab, c = 'k', o = {}) => ({ k: 'line', pts, lab, c, smooth: true, ...o });
  const G = (pt, xl, yl, o = {}) => ({ k: 'guide', pt, xl, yl, ...o });
  const A = (pts, c, lab, o = {}) => ({ k: 'area', pts, c, lab, ...o });
  const Ar = (a, b, o = {}) => ({ k: 'arrow', a, b, ...o });
  const Dt = (pt, lab, o = {}) => ({ k: 'dot', pt, lab, ...o });
  const T = (pt, s, o = {}) => ({ k: 'text', pt, s, ...o });
  const Bx = (pt, w, h, s, o = {}) => ({ k: 'box', pt, w, h, s, ...o });
  const Br = (a, b, s, o = {}) => ({ k: 'brace', a, b, s, ...o });

  /* ---- path drawing ---- */
  function pathD(pts, smooth) {
    const p = pts.map(([x, y]) => [X(x), Y(y)]);
    if (!smooth || p.length < 3) return 'M' + p.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' L');
    let d = 'M' + p[0][0].toFixed(1) + ' ' + p[0][1].toFixed(1);
    for (let i = 0; i < p.length - 1; i++) {
      const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return d;
  }

  /* ---- label rendering (normal, or as a numbered blank) ---- */
  function label(text, x, y, anchor, cls, ctx, extra = '') {
    if (text == null || text === '') return '';
    const key = String(text);
    if (ctx.blanks && ctx.blanks.has(key)) {
      const n = ctx.blanks.get(key);
      const fill = ctx.fills && ctx.fills[n];
      const state = ctx.state && ctx.state[n] ? ' ' + ctx.state[n] : '';
      const w = fill ? Math.max(30, fill.replace(/_/g, '').length * 7.4 + 14) : 30;
      const bx = anchor === 'end' ? x - w : anchor === 'middle' ? x - w / 2 : x - 2;
      return `<g class="slot${fill ? ' filled' : ''}${state}${ctx.active === n ? ' active' : ''}" data-slot="${n}" tabindex="0" role="button" aria-label="Blank ${n}${fill ? ', currently ' + esc(fill) : ''}">
        <rect x="${bx.toFixed(1)}" y="${(y - 13).toFixed(1)}" width="${w.toFixed(1)}" height="19" rx="9.5"/>
        <text x="${(bx + w / 2).toFixed(1)}" y="${(y + 1).toFixed(1)}" text-anchor="middle">${fill ? fmt(fill) : n}</text></g>`;
    }
    if (ctx.hideLabels && cls !== 'axl' && !GENERIC.test(key)) return '';
    if (ctx.hideLabels === 'all') return '';
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" class="lb ${cls}" ${extra}>${fmt(key)}</text>`;
  }

  function panel(pn, ctx) {
    mx = (pn.max && pn.max[0]) || 100; my = (pn.max && pn.max[1]) || 100; zy = pn.zy || 0;
    const ymin = pn.ymin || 0;
    let s = '', top = '';
    const Yv = y => Y(y - ymin) ;
    const axes = pn.ax !== null && pn.ax !== undefined;
    // grid ticks for numeric panels
    // numeric panels: guide labels win over tick labels they would collide with, and close guide labels stagger
    const gxo = new Map(), gyi = new Set();
    if (pn.ticks) {
      const [tx, ty] = pn.ticks;
      const gs = pn.els.filter(e => e.k === 'guide');
      const gx = gs.filter(e => e.xl && e.toX !== false).map(e => X(e.pt[0])), gy = gs.filter(e => e.yl && e.toY !== false).map(e => Y(e.pt[1]));
      for (let v = tx; v <= mx + 1e-9; v += tx) s += `<line class="grid" x1="${X(v)}" y1="${Y(0)}" x2="${X(v)}" y2="${Y(my)}"/>` + (gx.some(g => Math.abs(g - X(v)) < 30) ? '' : `<text class="tk" x="${X(v)}" y="${PY + 15}" text-anchor="middle">${+v.toFixed(2)}</text>`);
      for (let v = ty; v <= my + 1e-9; v += ty) s += `<line class="grid" x1="${X(0)}" y1="${Y(v)}" x2="${X(mx)}" y2="${Y(v)}"/>` + (gy.some(g => Math.abs(g - Y(v)) < 14) ? '' : `<text class="tk" x="${PX - 6}" y="${Y(v) + 4}" text-anchor="end">${+v.toFixed(2)}</text>`);
      let last = -1e9, lastLow = false;
      for (const e of gs.filter(e => e.xl && e.xo == null && e.toX !== false).sort((a, b) => a.pt[0] - b.pt[0])) {
        const x = X(e.pt[0]), low = !lastLow && x - last < 34;
        if (low) gxo.set(e, 14); lastLow = low; last = x;
      }
      last = -1e9; lastLow = false;
      for (const e of gs.filter(e => e.yl && e.yo == null && e.toY !== false).sort((a, b) => a.pt[1] - b.pt[1])) {
        const y = Y(e.pt[1]), inn = !lastLow && last - y < 14;
        if (inn) gyi.add(e); lastLow = inn; last = y;
      }
    }
    for (const e of pn.els) {
      const c = e.c || 'k';
      if (e.k === 'area') {
        const d = 'M' + e.pts.map(([x, y]) => X(x).toFixed(1) + ' ' + Y(y).toFixed(1)).join(' L') + 'Z';
        s = `<path class="ar a-${c}" d="${d}"/>` + s;   // areas go underneath
        if (e.lab) {
          const at = e.at || [e.pts.reduce((a, p) => a + p[0], 0) / e.pts.length, e.pts.reduce((a, p) => a + p[1], 0) / e.pts.length];
          top += label(e.lab, X(at[0]), Y(at[1]) + 4, 'middle', 'al t-' + c, ctx);
        }
      } else if (e.k === 'line') {
        s += `<path class="cv s-${c}${e.d ? ' dash' : ''}${e.thin ? ' thin' : ''}" d="${pathD(e.pts, e.smooth)}"/>`;
        if (e.lab) {
          const end = e.ls ? e.pts[0] : e.pts[e.pts.length - 1];
          const at = e.at ? [X(e.at[0]), Y(e.at[1])] : [X(end[0]) + (e.dx ?? 5), Y(end[1]) + (e.dy ?? -3)];
          top += label(e.lab, at[0], at[1], e.anchor || 'start', 't-' + c, ctx);
        }
      } else if (e.k === 'guide') {
        const [x, y] = e.pt;
        const x0 = e.toX === false ? null : X(x), y0 = e.toY === false ? null : Y(y);
        if (e.toY !== false) s += `<path class="gd" d="M${X(e.fromX ?? 0)} ${Y(y)} L${X(x)} ${Y(y)}"/>`;
        if (e.toX !== false) s += `<path class="gd" d="M${X(x)} ${Y(y)} L${X(x)} ${Y(e.fromY ?? zy)}"/>`;
        if (e.xl) top += label(e.xl, X(x), (e.fromY != null ? Y(e.fromY) : Y(zy)) + 16 + (e.xo || gxo.get(e) || 0), 'middle', 'tk2', ctx);
        if (e.yl) top += gyi.has(e) ? label(e.yl, PX + 5, Y(y) - 4, 'start', 'tk2', ctx) : label(e.yl, PX - 6, Y(y) + 4 + (e.yo || 0), 'end', 'tk2', ctx);
      } else if (e.k === 'dot') {
        top += `<circle class="dt" cx="${X(e.pt[0])}" cy="${Y(e.pt[1])}" r="3.4"/>`;
        if (e.lab) top += label(e.lab, X(e.pt[0]) + (e.dx ?? 6), Y(e.pt[1]) + (e.dy ?? -6), e.anchor || 'start', 'pt', ctx);
      } else if (e.k === 'arrow') {
        top += `<path class="aw${e.c ? ' s-' + e.c : ''}" d="M${X(e.a[0])} ${Y(e.a[1])} L${X(e.b[0])} ${Y(e.b[1])}" marker-end="url(#ah)"/>`;
        if (e.lab) top += label(e.lab, (X(e.a[0]) + X(e.b[0])) / 2 + (e.dx ?? 0), (Y(e.a[1]) + Y(e.b[1])) / 2 + (e.dy ?? -6), e.anchor || 'middle', 'fl', ctx);
      } else if (e.k === 'text') {
        const t = e.q ? label(e.s, X(e.pt[0]), Y(e.pt[1]), e.anchor || 'middle', 'tx' + (e.c ? ' t-' + e.c : ''), ctx)
          : `<text class="tx${e.c ? ' t-' + e.c : ''}${e.small ? ' sm' : ''}" x="${X(e.pt[0])}" y="${Y(e.pt[1])}" text-anchor="${e.anchor || 'middle'}">${fmt(e.s)}</text>`;
        top += t;
      } else if (e.k === 'box') {
        const x = X(e.pt[0]) - e.w / 2, y = Y(e.pt[1]) - e.h / 2;
        s += `<rect class="bx${e.c ? ' b-' + e.c : ''}" x="${x}" y="${y}" width="${e.w}" height="${e.h}" rx="8"/>`;
        const lines = e.s.split('\n');
        if (e.q && lines.length === 1) top += label(e.s, X(e.pt[0]), Y(e.pt[1]) + 4, 'middle', 'bt', ctx);
        else lines.forEach((ln, i) => { top += `<text class="bt" x="${X(e.pt[0])}" y="${Y(e.pt[1]) + 4 + (i - (lines.length - 1) / 2) * 14}" text-anchor="middle">${fmt(ln)}</text>`; });
      } else if (e.k === 'brace') {
        // a bracket along the x-axis (or a horizontal line) marking a distance
        const y = Y(e.a[1]), x1 = X(e.a[0]), x2 = X(e.b[0]);
        s += `<path class="br" d="M${x1} ${y - 4} L${x1} ${y} L${x2} ${y} L${x2} ${y - 4}"/>`;
        top += label(e.s, (x1 + x2) / 2, y + (e.dy ?? 14), 'middle', 'bl', ctx);
      }
    }
    let ax = '';
    if (axes) {
      ax += `<path class="axis" d="M${PX} ${PY - PH - 6} L${PX} ${PY} ${zy ? `M${PX} ${Y(zy)}` : ''} L${PX + PW + 6} ${Y(zy)}"/>`;
      if (!pn.ticks) ax += `<text class="tk" x="${PX - 7}" y="${PY + 14}" text-anchor="end">0</text>`;
      ax += label(pn.ax[0], PX - 20, 18, 'start', 'axl', ctx);
      ax += label(pn.ax[1], PX + PW + 4, Y(zy) + (pn.xlo ?? 32), 'end', 'axl', ctx);
    }
    return `<svg viewBox="0 0 ${W} ${H}" class="dgs" role="img" aria-label="${esc(pn.cap || 'Economics diagram')}">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ahp"/></marker></defs>
      ${s}${ax}${top}</svg>`;
  }

  // Render a diagram (all panels). ctx: {blanks: Map(label->n), fills, state, active, hideLabels, noCaps}
  function render(dg, ctx = {}) {
    const panels = dg.panels.map(pn => `<figure class="pn">${pn.cap && !ctx.noCaps ? `<figcaption>${esc(pn.cap)}</figcaption>` : ''}${panel(pn, ctx)}</figure>`).join('');
    return `<div class="dg n${dg.panels.length}">${panels}</div>`;
  }

  // Every quizzable label in a diagram, in drawing order, de-duplicated
  function labels(dg) {
    const out = [];
    const add = (s, f) => { if (s != null && s !== '' && (f || !GENERIC.test(String(s))) && !out.includes(String(s))) out.push(String(s)); };
    for (const pn of dg.panels) {
      if (pn.ax) { add(pn.ax[0]); add(pn.ax[1]); }
      for (const e of pn.els) {
        if (e.nq) continue;
        if (e.k === 'line' || e.k === 'area' || e.k === 'dot') add(e.lab, e.q);
        else if (e.k === 'guide') { add(e.xl); add(e.yl); }
        else if ((e.k === 'text' || e.k === 'box') && e.q) add(e.s);
        else if (e.k === 'arrow' && e.lab) add(e.lab);
        else if (e.k === 'brace') add(e.s);
      }
    }
    return out;
  }

  return { render, labels, html, seg, yAt, xAt, ix, mv, solve, L, F, P, G, A, Ar, Dt, T, Bx, Br };
})();

/* ---------- Diagram bank, part 1: Unit 1 and Unit 2 (markets, elasticity, intervention) ---------- */
const { seg, yAt, xAt, ix, mv, solve, L, F, P, G, A, Ar, Dt, T, Bx, Br } = DG;
const PQ = ['Price', 'Quantity'];
const D0 = seg(5, 95, 90, 10), S0 = seg(10, 10, 90, 90);          // y = 100 - x, y = x
const Dw = seg(0, 95, 80, 15), Sw = seg(0, 5, 80, 85);            // y = 95 - x, y = 5 + x (meet axes for welfare areas)
const ppc = r => x => r * Math.sqrt(Math.max(0, 1 - (x / r) ** 2));

const DIAGRAMS = [];
const add = d => DIAGRAMS.push(d);

/* ======================= UNIT 1 ======================= */
add({
  id: 'ppc', u: 1, sub: '1.1 What is economics?', t: 'Production possibilities curve (PPC)', fam: 'ppc',
  panels: [{ ax: ['Capital goods', 'Consumer goods'], els: [
    F(ppc(85), 0, 85, 'PPC', 'd', { at: [70, 52] }),
    G([30, ppc(85)(30)], 'X_1', 'Y_1'), G([55, ppc(85)(55)], 'X_2', 'Y_2'),
    Dt([30, ppc(85)(30)], 'A'), Dt([55, ppc(85)(55)], 'B'),
    Dt([30, 30], 'C'), T([30, 20], 'Inefficient / unemployment', { q: true, c: 'k', small: true }),
    Dt([75, 75], 'D'), T([75, 84], 'Unattainable', { q: true, small: true }),
  ] }],
  tip: 'Scarcity, choice, opportunity cost and unemployment of resources.',
  q: 'Using a production possibilities curve (PPC) diagram, explain the concept of opportunity cost.',
  mk: ['Axes show two goods (e.g. capital goods and consumer goods)', 'PPC drawn concave (bowed out) and labelled', 'Movement along the PPC from A to B shown with values X₁→X₂ and Y₁→Y₂', 'Opportunity cost explained as the Y₁−Y₂ of capital goods given up to gain X₁−X₂ consumer goods', 'Point inside the PPC linked to unemployed or inefficiently used resources'],
  ans: 'The PPC shows the maximum combinations of two goods an economy can produce when all resources are fully and efficiently employed. Because resources are scarce, choosing more consumer goods (X₁ to X₂, a move from A to B) means giving up capital goods (Y₁ to Y₂). That sacrifice is the opportunity cost. The concave shape shows increasing opportunity cost, because resources are not equally suited to both goods. Point C, inside the curve, shows unemployment or inefficiency; point D is unattainable with current resources and technology.',
});
add({
  id: 'ppc-oc', u: 1, sub: '1.1 What is economics?', t: 'PPC: increasing vs constant opportunity cost', fam: 'ppc',
  panels: [
    { cap: '(a) Increasing opportunity cost', ax: ['Good Y', 'Good X'], els: [F(ppc(80), 0, 80, 'Concave PPC', 'd', { at: [52, 70] })] },
    { cap: '(b) Constant opportunity cost', ax: ['Good Y', 'Good X'], els: [L(seg(0, 80, 80, 0), 'Straight-line PPC', 'd', { at: [44, 50] })] },
  ],
  tip: 'The difference between constant and increasing opportunity costs.',
  q: 'Using PPC diagrams, distinguish between increasing and constant opportunity costs.',
  mk: ['Two PPCs drawn with axes labelled as two goods', 'Concave PPC labelled as increasing opportunity cost', 'Straight-line PPC labelled as constant opportunity cost', 'Explanation that concavity arises because resources are not equally suited to producing both goods', 'Straight line explained by resources being equally suited (perfectly adaptable)'],
  ans: 'In diagram (a) the PPC is concave: each extra unit of good X requires giving up larger and larger amounts of good Y. This is increasing opportunity cost, which happens because resources are specialised and not equally efficient in both uses, so less suitable resources are moved as production of X expands. In diagram (b) the PPC is a straight line with a constant slope, so each extra unit of X always costs the same amount of Y. This happens only when resources are equally suited to producing both goods, which is rare in reality.',
});
add({
  id: 'ppc-growth', u: 1, sub: '1.1 / 3.3 Economic growth', t: 'Economic growth in the PPC model', fam: 'ppc-growth',
  panels: [
    { cap: '(a) Actual growth', ax: ['Good Y', 'Good X'], els: [F(ppc(80), 0, 80, 'PPC', 'd', { at: [68, 48] }), Dt([30, 30], 'A'), Dt([50, ppc(80)(50)], 'B'), Ar([33, 33], [47, ppc(80)(50) - 4])] },
    { cap: '(b) Growth in production possibilities', ax: ['Good Y', 'Good X'], els: [F(ppc(62), 0, 62, 'PPC_1', 'd', { at: [54, 40] }), F(ppc(85), 0, 85, 'PPC_2', 'd', { at: [76, 52] }), Ar([42, 44], [57, 61])] },
  ],
  tip: 'The difference between actual growth (fuller use of resources) and growth in production possibilities.',
  q: 'Using a PPC diagram, explain the difference between actual economic growth and an increase in production possibilities.',
  mk: ['Diagram (a): movement from a point inside the PPC towards the curve', 'Diagram (b): outward shift from PPC₁ to PPC₂', 'Actual growth linked to reduced unemployment / less inefficiency', 'Growth in potential linked to more or better resources (e.g. investment, education, technology)', 'Correct labels on axes and curves'],
  ans: 'Actual growth is an increase in real output. In diagram (a) it is shown by a movement from point A, inside the PPC, to point B on the curve, as unemployed resources are put to work or inefficiencies are reduced. Growth in production possibilities (potential output) is an outward shift of the curve from PPC₁ to PPC₂ in diagram (b). It results from increases in the quantity of resources (e.g. investment in physical capital, more labour) or improvements in their quality (education, health, technology). Long-term growth requires the PPC to shift outward.',
});
add({
  id: 'circular-flow', u: 1, sub: '1.2 / 3.1 Circular flow of income', t: 'Circular flow of income with leakages and injections', fam: 'flow',
  panels: [{ ax: null, els: [
    Bx([9, 50], 86, 60, 'Households', { q: true }), Bx([91, 50], 86, 60, 'Firms', { q: true }),
    Bx([50, 76], 100, 32, 'Financial sector', { q: true, c: 'm' }), Bx([50, 50], 100, 32, 'Government', { q: true, c: 'm' }), Bx([50, 24], 100, 32, 'Foreign sector', { q: true, c: 'm' }),

const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const nice = m => { const raw = m / 5, p = 10 ** Math.floor(Math.log10(raw)), n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; };
const up = (v, s) => Math.ceil(v / s) * s;
const n2 = v => +(+v).toFixed(2);
const money = v => '$' + n2(v).toLocaleString('en-US', { maximumFractionDigits: 2 });
const fn = (k, v) => `${k}`.replace('VAL', v);
// linear market: Qd = a − bP, Qs = −c + dP  (c > 0 so supply starts on the price axis)
function market() {
  for (;;) {
    const b = R(2, 6), d = R(2, 5), P = R(4, 14), Q = R(10, 30) * 2;
    const a = Q + b * P, c = d * P - Q;
    if (c > 0 && c / d >= 1 && a / b <= 40) return { a, b, c, d, P, Q };
  }
}

  const pmax = Math.max(m.a / m.b, pmaxHint) * 1.05, qmax = Math.max(m.a, qmaxHint * 1.05) * 1.02;
  const sx = nice(qmax), sy = nice(pmax);
  const Qmax = up(qmax, sx), Pmax = up(pmax, sy);
  const D = DG.seg(0, m.a / m.b, m.a, 0);
  const Sp = Math.min(Pmax * 0.97, (Qmax * 0.95 + m.c) / m.d);
  const S = DG.seg(0, m.c / m.d, -m.c + m.d * Sp, Sp);
  return { max: [Qmax, Pmax], ticks: [sx, sy], ax: ['Price ($)', 'Quantity (units)'], els: [DG.L(D, 'D', 'd'), DG.L(S, 'S', 's'), ...extra] };
}

// The generators pick random numbers, so clip every drawn line to its panel's axes (Liang–Barsky on each segment).
function clipPts(pts, mx, my) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[i + 1], dx = x2 - x1, dy = y2 - y1;
    let t0 = 0, t1 = 1, ok = true;
    for (const [p, q] of [[-dx, x1], [dx, mx - x1], [-dy, y1], [dy, my - y1]]) {
      if (p === 0) { if (q < 0) ok = false; continue; }
      const r = q / p; if (p < 0) t0 = Math.max(t0, r); else t1 = Math.min(t1, r);
    }
    if (!ok || t0 > t1) continue;
    const a = [x1 + t0 * dx, y1 + t0 * dy], b = [x1 + t1 * dx, y1 + t1 * dy];
    if (!out.length || Math.hypot(out[out.length - 1][0] - a[0], out[out.length - 1][1] - a[1]) > 1e-9) out.push(a);
    out.push(b);
  }
  return out;
}
// Sutherland–Hodgman: clip a shaded area to the same box
function clipPoly(pts, mx, my) {
  const edges = [[p => p[0] >= 0, null, 'x', 0], [p => p[0] <= mx, null, 'x', mx], [p => p[1] >= 0, null, 'y', 0], [p => p[1] <= my, null, 'y', my]];
  let out = pts;
  for (const [inside, , ax, v] of edges) {
    const src = out; out = [];
    for (let i = 0; i < src.length; i++) {
      const a = src[i], b = src[(i + 1) % src.length], ia = inside(a), ib = inside(b);
      const cut = () => { const k = ax === 'x' ? (v - a[0]) / (b[0] - a[0]) : (v - a[1]) / (b[1] - a[1]); return [a[0] + k * (b[0] - a[0]), a[1] + k * (b[1] - a[1])]; };
      if (ia) out.push(a); if (ia !== ib) out.push(cut());
    }
  }
  return out;
}
for (const c of CALCS) {
  const gen = c.gen;
  c.gen = () => {
    const g = gen.call(c);
    if (g.panel) {
      const [mx, my] = g.panel.max || [100, 100];
      const fix = els => els && els.map(e => e.k === 'line' ? { ...e, pts: clipPts(e.pts, mx, my) } : e.k === 'area' ? { ...e, pts: clipPoly(e.pts, mx, my) } : e);
      g.panel = { ...g.panel, els: fix(g.panel.els) }; if (g.post) g.post = fix(g.post);
    }
    return g;
  };
}

    get(k, d) { try { const v = localStorage.getItem('shg:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('shg:' + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
  };

  const WORLDS = [
    { id: 'micro', name: 'Markets', units: [1, 2], blurb: 'Units 1–2: PPC, demand and supply, elasticity, intervention, market failure' },
    { id: 'macro', name: 'Macro', units: [3], blurb: 'Unit 3: AD/AS, output gaps, unemployment, inflation, policy' },
    { id: 'global', name: 'Global', units: [4], blurb: 'Unit 4: trade, protection, exchange rates, development' },
    { id: 'mixed', name: 'Grand tour', units: [1, 2, 3, 4], blurb: 'The whole syllabus, shuffled. The real exam warm-up.' },
  ];
  const STARS = [1500, 4000, 8000];
  const ROUNDS = {
    shift: { name: 'Shift it', t: 26, w: 3 },
    name: { name: 'Name that diagram', t: 12, w: 3 },
    label: { name: 'Label drop', t: 32, w: 2 },
    hunt: { name: 'Hunt the area', t: 15, w: 2 },
    calc: { name: 'Number crunch', t: 100, w: 1 },

  const LIVES = 3, MAXLIVES = 5;

  let G = null;            // the current run
  let keys = null;         // keyboard handler for the current screen
  let level = store.get('level', 'SL');
  // round types the player has switched on (any combination; at least one)
  let picks = store.get('picks', ['shift', 'name', 'label', 'hunt', 'calc']);
  const MODES = [
    ['shift', 'Shift it', 'Read the news. Drag the curve that moves, then call what happens to price and quantity.', 'AO2'],
    ['name', 'Name that diagram', 'A diagram flashes up. Name it before the fuse burns out.', ''],
    ['label', 'Label drop', 'Drag the right labels onto the blanks. One label is a decoy.', 'AO4'],
    ['hunt', 'Hunt the area', 'Tap the welfare loss, tax revenue, abnormal profit or surplus.', ''],
    ['calc', 'Number crunch', 'Calculate from the diagram: tax revenue, PED, the multiplier and more.', 'HL · AO4'],
  ];
  const modeName = m => MODES.find(x => x[0] === m)[1];
  const allTypes = lv => MODES.map(m => m[0]).filter(id => id !== 'calc' || lv === 'HL');
  const chosen = lv => allTypes(lv).filter(id => picks.includes(id));
  const isAll = (types, lv) => allTypes(lv).every(t => types.includes(t));
  const mixName = (types, lv) => isAll(types, lv) ? 'All rounds' : types.map(modeName).join(' + ');

  /* ---------- pools ---------- */
  const inWorld = (w, u) => w.units.includes(u);
  // how many items a round type has in a world at a level (used before a run starts)
  const hasRounds = (type, w, lv) => { const g = G; G = { world: w, level: lv }; try { return POOLS[type]().length > 0; } finally { G = g; } };
  const diagPool = () => DIAGRAMS.filter(d => inWorld(G.world, d.u) && (G.level === 'HL' || !d.hl));
  const scenPool = () => SCENARIOS.filter(s => inWorld(G.world, MODELS[s.m].u) && (G.level === 'HL' || !MODELS[s.m].hl));
  const labelPool = () => diagPool().filter(d => DG.labels(d).length >= 3);
  const NICE = { CS: 'Consumer surplus', PS: 'Producer surplus' };
  const areaName = e => { const l = e.lab && !/^[A-F]$/.test(e.lab) ? e.lab : (e.c === 'wl' ? 'Welfare loss' : null); return l && (NICE[l] || l); };
  const areaNames = d => new Set(d.panels.flatMap(p => p.els.filter(e => e.k === 'area').map(areaName).filter(Boolean)));
  const huntPool = () => diagPool().filter(d => areaNames(d).size >= 2);
  const calcPool = () => G.level === 'HL' ? CALCS.filter(c => inWorld(G.world, c.u)) : [];
  const POOLS = { shift: scenPool, name: diagPool, label: labelPool, hunt: huntPool, calc: calcPool };

  // pick an item, avoiding ones seen recently in this run
  function fresh(list, key) {
    const f = list.filter(x => !G.recent.includes(key(x)));
    const x = any(f.length ? f : list);
    G.recent.push(key(x)); if (G.recent.length > 24) G.recent.shift();
    return x;
  }

  /* ---------- scoring ---------- */
  const mult = () => Math.min(5, 1 + Math.floor(G.streak / 3));
  const speed = () => Math.max(0.55, 1 - 0.08 * (G.lvl - 1));
  const starsFor = s => STARS.filter(t => s >= t).length;
  // the full mix keeps the original key; any other combination gets its own best score
  const bestKey = (w, types = chosen(level)) => `best:${w}:${level}` + (isAll(types, level) ? '' : ':' + [...types].sort().join('+'));
  const starSvg = on => `<svg viewBox="0 0 24 24" class="${on ? 'on' : 'off'}" aria-hidden="true"><path stroke-width="1.6" stroke-linejoin="round" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.1l-5.7 3.2 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>`;
  const heart = cls => `<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.1 1.7-1.9 3.1-3.1 5.3-3.1 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>`;

  /* ---------- HOME ---------- */
  function home() {
    G = null; stopTimer(); $('#hud').hidden = true;
    if (!chosen(level).length) picks = [...new Set([...picks, ...allTypes(level)])];
    const modes = MODES.filter(([id]) => id !== 'calc' || level === 'HL'), on = chosen(level), all = isAll(on, level);
    $('#main').innerHTML = `<section class="home">
      <div class="title">
        <h1><span class="shift">Shift</span> Happens</h1>
        <p>An arcade run through the <b>IB Economics diagrams</b> for Paper 2 and Paper 3. Drag curves, drop labels, hunt the welfare loss and beat the clock. Three lives, so think before you tap.</p>
      </div>
      <div class="picker">
        <span class="flab">Course</span>
        <span class="seg" role="group" aria-label="Course level">
          <button type="button" data-lv="SL" aria-pressed="${level === 'SL'}">SL</button>
          <button type="button" data-lv="HL" aria-pressed="${level === 'HL'}">HL</button>
        </span>
        <span class="hint">${level === 'SL' ? 'Core diagrams that every student needs.' : 'Adds the HL-only diagrams, the money market and Number crunch calculations.'}</span>
      </div>
      <div class="step"><h2><span>1</span> Choose your rounds</h2>

      </div>

      <div class="worlds">${WORLDS.map(w => {
        const ok = on.some(t => hasRounds(t, w, level));
        const b = store.get(bestKey(w.id), 0), n = starsFor(b);
        return `<button type="button" class="world" data-w="${w.id}" ${ok ? '' : 'disabled'}>
          <span class="wn">${w.name}</span><span class="wb">${w.blurb}</span>
          <span class="wf">${ok ? `<span>Best <b>${b.toLocaleString('en-US')}</b></span><span class="stars" aria-label="${n} of 3 stars">${[0, 1, 2].map(i => starSvg(i < n)).join('')}</span>` : `<span>None of your rounds are in this world</span>`}</span>
        </button>`;
      }).join('')}</div></div>
      <p class="basics">Points = 100 + a time bonus, times your streak multiplier (×2 at 3 in a row, up to ×5). Every 5 correct answers you level up and the fuse gets shorter. A streak of 10 wins an extra life. Stars at ${STARS.map(s => s.toLocaleString('en-US')).join(', ')} points.</p>
      <p class="foot">Want to study first? Every diagram, with model answers, is in <a href="https://harrisonarmour57-web.github.io/ib-diagram-drill/" target="_blank" rel="noopener">IB Diagram Drill</a>. Diagrams are redrawn for practice and follow the IB Economics guide (first assessment 2022). Scores are saved in this browser only.</p>
    </section>`;
    $$('[data-lv]').forEach(b => b.onclick = () => { level = b.dataset.lv; store.set('level', level); home(); });
    $$('[data-m]').forEach(b => b.onclick = () => {
      const id = b.dataset.m, cur = chosen(level);
      if (cur.includes(id)) { if (cur.length === 1) return; picks = picks.filter(x => x !== id); } else picks = [...picks, id];
      store.set('picks', picks); home(); $(`[data-m="${id}"]`).focus({ preventScroll: true });
    });
    $('#allr').onclick = () => { picks = [...new Set([...picks, ...allTypes(level)])]; store.set('picks', picks); home(); };
    $$('[data-w]').forEach(b => b.onclick = () => start(WORLDS.find(w => w.id === b.dataset.w)));
    keys = null;
  }

  /* ---------- RUN ---------- */
  function start(world) {
    G = { world, level, types: chosen(level), score: 0, lives: LIVES, streak: 0, top: 0, lvl: 1, right: 0, rounds: 0, recent: [], missed: new Map(), last: null };
    $('#hud').hidden = false; hud(); next();
  }
  function hud(pop) {
    $('#hud').innerHTML = `<div class="hud-in">
      <span class="logo"><span>Shift</span> Happens · ${isAll(G.types, G.level) ? '' : mixName(G.types, G.level) + ' · '}${G.world.name} ${G.level}</span>
      <span class="stat"><small>Score</small><b id="hs">${G.score.toLocaleString('en-US')}${pop ? `<span class="pop">${pop}</span>` : ''}</b></span>
      <span class="stat"><small>Streak</small><b>${G.streak}${mult() > 1 ? `<em>×${mult()}</em>` : ''}</b></span>
      <span class="stat"><small>Level</small><b>${G.lvl}</b></span>
      <span class="lives" aria-label="${G.lives} lives left">${Array.from({ length: Math.max(LIVES, G.lives) }, (_, i) => heart(i < G.lives ? 'on' : 'off' + (i === G.lives && G.justLost ? ' lost' : ''))).join('')}</span>
      <button type="button" class="end" id="end">End run</button>
    </div><div class="fuse" id="fuse"><i id="bar"></i></div>`;
    $('#end').onclick = () => over();
    G.justLost = false;
  }
  function toast(big, small = '') {
    const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `${big}${small ? `<small>${small}</small>` : ''}`;
    document.body.appendChild(t); setTimeout(() => t.remove(), 1700);
  }

  function pickType() {
    const avail = Object.entries(ROUNDS).filter(([k]) => G.types.includes(k) && POOLS[k]().length);
    let opts = avail.filter(([k]) => k !== G.last); if (!opts.length) opts = avail;
    const tot = opts.reduce((a, [, r]) => a + r.w, 0); let x = Math.random() * tot;
    for (const [k, r] of opts) { x -= r.w; if (x <= 0) return k; }
    return opts[0][0];
  }
  function next() {
    if (!G) return;
    if (G.lives <= 0) return over();
    const type = pickType(); G.last = type; G.rounds++;
    $('#main').innerHTML = `<section class="play" id="play"><div class="prompt" id="prompt"></div><div class="board" id="board"></div><div class="ctrl" id="ctrl"></div></section>`;
    G.round = { type, done: false };
    ({ shift: rShift, name: rName, label: rLabel, hunt: rHunt, calc: rCalc })[type]();
    const t = ROUNDS[type].t * (type === 'calc' ? Math.max(0.75, speed()) : speed());
    startTimer(t);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  const eyebrow = (extra = '') => `<p class="eyebrow"><span class="rt">${ROUNDS[G.round.type].name}</span><span>Round ${G.rounds}</span>${extra}</p>`;

  /* ---------- timer (the fuse) ---------- */
  let raf = 0;
  function startTimer(sec) {
    stopTimer();
    const t0 = performance.now(), ms = sec * 1000;
    G.round.ms = ms; G.round.left = ms;
    const tick = now => {
      if (!G || G.round.done) return;
      const left = Math.max(0, ms - (now - t0)); G.round.left = left;
      const bar = $('#bar'), fuse = $('#fuse');
      if (bar) { bar.style.transform = `scaleX(${left / ms})`; fuse.classList.toggle('low', left / ms < 0.25); }
      if (left <= 0) { G.round.timeout && G.round.timeout(); return; }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }
  function stopTimer() { cancelAnimationFrame(raf); }

  // Finish a round: score it, show the corrected diagram and feedback, wait for "Next"
  function resolve(ok, { title, body = '', tip = '', missed = null, timeout = false } = {}) {
    if (!G || G.round.done) return;
    G.round.done = true; stopTimer(); $('#fuse') && $('#fuse').classList.add('paused');
    let line, pop = '';
    if (ok) {
      const frac = G.round.left / G.round.ms, m = mult();
      const pts = Math.round((100 + 100 * frac) * m);
      G.score += pts; G.right++; G.streak++; G.top = Math.max(G.top, G.streak); pop = `+${pts}`;
      line = `<span class="big">+${pts}</span>`;
      const st = G.streak, nm = mult();
      if (st % 10 === 0 && G.lives < MAXLIVES) { G.lives++; setTimeout(() => toast('Extra life!', `${st} in a row`), 250); }
      else if (nm > m) setTimeout(() => toast(`Streak ×${nm}`, `${st} in a row`), 250);
      if (G.right % 5 === 0) { const lv = ++G.lvl; setTimeout(() => toast(`Level ${lv}`, 'The fuse gets shorter'), nm > m ? 1500 : 250); }
    } else {
      G.lives--; G.streak = 0; G.justLost = true;
      line = `<span class="big">${timeout ? 'Time’s up' : 'Life lost'}</span>`;
      if (missed) G.missed.set(missed.id, missed);
    }
    hud(pop); $('#fuse').classList.add('paused'); $('#bar').style.transform = `scaleX(${G.round.left / G.round.ms})`;
    const last = G.lives <= 0;
    $('#ctrl').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}" role="status">${line}<p><strong>${title}</strong></p>${body ? `<p>${body}</p>` : ''}${tip ? `<p class="tip">${tip}</p>` : ''}</div>
      <div class="row"><button type="button" class="btn" id="next">${last ? 'See results' : 'Next round'} ▸</button></div>`;
    $('#next').onclick = next; $('#next').focus({ preventScroll: true });
    keys = k => { if (k === 'Enter' || k === ' ') next(); };
  }

  /* ======================= ROUND: SHIFT IT ======================= */
  const mdf = x => 1800 / (x + 8) - 6;     // money demand curve (same shape as the Drill)
  function curveEl(model, kind, dx, lab, extra = {}) {
    const c = kind === 'down' ? 'd' : kind === 'up' ? 's' : kind === 'vert' ? (model === 'money' ? 's' : 'g') : 'd';
    if (kind === 'down') return DG.L(DG.mv(DG.seg(10, 90, 90, 10), dx, 0), lab, c, extra);
    if (kind === 'up') return DG.L(DG.mv(DG.seg(10, 10, 90, 90), dx, 0), lab, c, extra);
    if (kind === 'vert') return DG.L(DG.seg(50 + dx, 0, 50 + dx, 92), lab, c, { at: [51.5 + dx, 93], ...extra });
    return DG.F(x => mdf(x - dx), 6 + Math.max(0, dx), 95, lab, c, extra);
  }
  // x position (data space) of a curve at height y, for grabbing
  function curveX(kind, y, dx) {
    if (kind === 'down') return 100 - y + dx;
    if (kind === 'up') return y + dx;
    if (kind === 'vert') return 50 + dx;
    return 1800 / (y + 6) - 8 + dx;
  }
  function shiftModel(sc) {
    const M = MODELS[sc.m], names = Object.keys(M.curves);
    const eff = (off, n) => off[n] + (n === 'SRAS' && off.LRAS ? off.LRAS : 0);   // LRAS drags SRAS with it
    const eq = off => {
      if (sc.m === 'money') { const x = 50 + eff(off, 'S_m'); return [x, mdf(x - eff(off, 'D_m'))]; }
      const dn = names.find(n => M.curves[n] === 'down'), un = names.find(n => M.curves[n] === 'up');
      return DG.ix(DG.mv(DG.seg(10, 90, 90, 10), eff(off, dn), 0), DG.mv(DG.seg(10, 10, 90, 90), eff(off, un), 0));
    };
    const draw = (off, reveal) => {
      const els = [];
      for (const n of names) {
        const k = M.curves[n], dx = eff(off, n);
        const n1 = n.includes('_') ? n + '1' : n + '_1', n2 = n.includes('_') ? n + '2' : n + '_2';
        if (Math.abs(dx) > 0.5) { els.push(curveEl(sc.m, k, 0, n1, { thin: true, d: true })); els.push(curveEl(sc.m, k, dx, n2)); }
        else els.push(curveEl(sc.m, k, 0, n));
      }
      const [gy, gx] = M.g, zero = Object.fromEntries(names.map(n => [n, 0])), e1 = eq(zero);
      els.push(DG.G(e1, gx + '_1', gy + '_1'), DG.Dt(e1, 'e_1'));
      if (reveal) {
        const e2 = eq(off); els.push(DG.G(e2, gx + '_2', gy + '_2'), DG.Dt(e2, 'e_2'));
        const c = names.find(n => off[n]), k = M.curves[c], dx = off[c];
        const y0 = k === 'vert' || k === 'curve' ? 70 : 78, x0 = k === 'down' ? 22 : k === 'up' ? 78 : k === 'vert' ? 50 : 18;
        els.push(DG.Ar([x0 + Math.sign(dx) * 2, y0], [x0 + dx - Math.sign(dx) * 3, y0]));
      }
      return { panels: [{ ax: M.ax, els }] };
    };
    return { M, names, eq, draw };
  }
  function rShift() {
    const sc = fresh(scenPool(), s => s.s), { M, names, eq, draw } = shiftModel(sc);
    const off = Object.fromEntries(names.map(n => [n, 0]));
    const dir = (a, b) => Math.abs(a - b) < 0.5 ? 0 : a > b ? 1 : -1;
    const truthOff = { ...off, [sc.c]: sc.d * 18 }, e1 = eq(off), e2 = eq(truthOff);
    const right = `${dir(e2[1], e1[1])},${dir(e2[0], e1[0])}`;
    const all = []; for (const a of [1, -1, 0]) for (const b of [1, -1, 0]) all.push(`${a},${b}`);
    const opts = shuf([right, ...shuf(all.filter(x => x !== right && x !== '0,0')).slice(0, 3)]);
    const arrow = v => v > 0 ? '↑ rises' : v < 0 ? '↓ falls' : 'no change';
    const low = v => v.replace(/^[A-Z](?=[a-z])/, c => c.toLowerCase());
    const optText = o => { const [a, b] = o.split(',').map(Number); return `${M.v[0]} ${arrow(a)}, ${low(M.v[1])} ${arrow(b)}`; };
    const word = v => v > 0 ? 'rises' : v < 0 ? 'falls' : 'does not change';
    const [ra, rb] = right.split(',').map(Number), outcome = `So ${low(M.v[0])} ${word(ra)} and ${low(M.v[1])} ${word(rb)}.`;
    let pick = null;

    $('#prompt').innerHTML = `${eyebrow(MODELS[sc.m].hl ? '<span class="chip hl">HL</span>' : '')}<p class="ctx">${H(sc.ctx)}</p><h2>${H(sc.s)}</h2>
      <p class="how">Drag the curve that shifts (or use the arrows), then call the outcome.</p>`;
    const board = $('#board'); board.classList.add('drag');
    const paint = (reveal = false) => { board.innerHTML = DG.render(draw(off, reveal)) + (reveal ? '' : '<span class="hint">drag a curve ↔</span>'); };
    const moved = () => names.find(n => Math.abs(off[n]) > 0.5);
    const ctrl = () => {
      const m = moved();
      $('#ctrl').innerHTML = `<div class="nudges">${names.map(n => `<span class="nudge${m === n ? ' on' : ''}"><button type="button" data-n="${n}" data-d="-1" aria-label="Shift ${n} left">◀</button><span>${H(n)}</span><button type="button" data-n="${n}" data-d="1" aria-label="Shift ${n} right">▶</button></span>`).join('')}</div>
        <p class="qlab${m ? '' : ' off'}">${m ? `${H(m)} shifted ${off[m] > 0 ? 'right' : 'left'}. What happens?` : 'Shift a curve first.'}</p>
        <div class="opts">${opts.map((o, i) => `<button type="button" class="opt" data-o="${o}" aria-pressed="${pick === o}"><span class="k">${i + 1}</span>${optText(o)}</button>`).join('')}</div>
        <div class="row"><button type="button" class="btn" id="lock" ${m && pick ? '' : 'disabled'}>Lock it in</button></div>`;
      $$('[data-n]').forEach(b => b.onclick = () => { const n = b.dataset.n, d = +b.dataset.d * 18; const was = off[n]; names.forEach(x => off[x] = 0); off[n] = was === d ? 0 : d; paint(); ctrl(); });
      $$('[data-o]').forEach(b => b.onclick = () => { pick = b.dataset.o; ctrl(); });
      $('#lock').onclick = lock;
    };
    const lock = () => {
      const m = moved(); if (!m || !pick || G.round.done) return;
      const curveOk = m === sc.c && Math.sign(off[m]) === sc.d, outOk = pick === right, ok = curveOk && outOk;
      names.forEach(x => off[x] = 0); off[sc.c] = sc.d * 18; paint(true); board.classList.remove('drag');
      const wrong = !curveOk ? 'Wrong curve or wrong direction. ' : !outOk ? 'Right shift, wrong outcome. ' : '';
      const ext = sc.c === 'LRAS' ? ' (SRAS shifts with it)' : '';
      resolve(ok, {
        title: ok ? 'Spot on.' : `${wrong}${H(sc.c)} shifts ${sc.d > 0 ? 'right' : 'left'}${ext}.`,
        body: `${H(sc.why)} ${outcome}`,
      });
    };
    G.round.timeout = () => { names.forEach(x => off[x] = 0); off[sc.c] = sc.d * 18; paint(true); board.classList.remove('drag'); resolve(false, { timeout: true, title: `${H(sc.c)} shifts ${sc.d > 0 ? 'right' : 'left'}.`, body: `${H(sc.why)} ${outcome}` }); };

    // pointer dragging on the board
    let grab = null, x0 = 0, base = 0;
    const toData = e => {
      const svg = $('svg', board); if (!svg) return null;
      const r = svg.getBoundingClientRect();
      return [((e.clientX - r.left) * 360 / r.width - 58) * 100 / 280, (262 - (e.clientY - r.top) * 312 / r.height) * 100 / 228];
    };
    board.onpointerdown = e => {
      if (G.round.done) return;
      const p = toData(e); if (!p) return;
      const y = clamp(p[1], 4, 96); let best = null, bd = 13;
      for (const n of names) {
        const k = M.curves[n], dx = n === 'SRAS' ? off.SRAS + off.LRAS : off[n];
        const d = Math.abs(p[0] - curveX(k, y, dx)); if (d < bd) { bd = d; best = n; }
      }
      if (!best) return;
      e.preventDefault(); grab = best; x0 = p[0]; base = off[best];
      names.forEach(n => { if (n !== best) off[n] = 0; });
      board.setPointerCapture(e.pointerId); board.classList.add('grabbing');
    };
    board.onpointermove = e => {
      if (!grab) return; const p = toData(e); if (!p) return;
      off[grab] = clamp(base + p[0] - x0, -32, 32); paint();
    };
    const drop = () => {
      if (!grab) return;
      off[grab] = Math.abs(off[grab]) < 6 ? 0 : Math.sign(off[grab]) * 18;
      grab = null; board.classList.remove('grabbing'); paint(); ctrl();
    };
    board.onpointerup = drop; board.onpointercancel = drop;
    paint(); ctrl();
    keys = k => { if (/^[1-4]$/.test(k) && opts[+k - 1]) { pick = opts[+k - 1]; ctrl(); } else if (k === 'Enter') lock(); };
  }

  /* ======================= ROUND: NAME THAT DIAGRAM ======================= */
  function distractors(d, list, n = 3) {
    const fams = new Set([d.fam]), out = [];
    for (const x of [...shuf(list.filter(x => x.u === d.u)), ...shuf(list), ...shuf(DIAGRAMS)]) { if (!fams.has(x.fam)) { fams.add(x.fam); out.push(x); } if (out.length === n) break; }
    return out;
  }
  function rName() {
    const list = diagPool(), d = fresh(list, x => x.id), opts = shuf([d, ...distractors(d, list)]);
    const hard = G.lvl >= 3;
    $('#prompt').innerHTML = `${eyebrow((d.hl ? '<span class="chip hl">HL</span>' : '') + (hard ? '<span class="chip">labels hidden</span>' : ''))}<h2>Which diagram is this?</h2>`;
    $('#board').innerHTML = DG.render(d, { noCaps: true, hideLabels: hard });
    $('#ctrl').innerHTML = `<div class="opts">${opts.map((o, i) => `<button type="button" class="opt" data-i="${i}"><span class="k">${i + 1}</span>${H(o.t)}</button>`).join('')}</div>`;
    const reveal = () => { $('#board').innerHTML = DG.render(d); };
    const answer = i => {
      if (G.round.done) return;
      const ok = opts[i] === d;
      $$('.opt').forEach((b, j) => { b.disabled = true; if (opts[j] === d) b.classList.add('ok'); else if (j === i) b.classList.add('bad'); });
      reveal(); const fbx = $('#ctrl').innerHTML;
      resolve(ok, { title: ok ? H(d.t) : `It’s ${H(d.t)}.`, tip: H(d.tip), missed: d });
      $('#ctrl').insertAdjacentHTML('afterbegin', fbx); $$('#ctrl .opt').forEach(b => b.disabled = true);
    };
    $$('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
    G.round.timeout = () => { reveal(); resolve(false, { timeout: true, title: `It’s ${H(d.t)}.`, tip: H(d.tip), missed: d }); };
    keys = k => { if (/^[1-4]$/.test(k)) answer(+k - 1); };
  }

  /* ======================= ROUND: LABEL DROP ======================= */
  function rLabel() {
    const d = fresh(labelPool(), x => x.id);
    const all = DG.labels(d), axes = new Set(d.panels.flatMap(p => p.ax || []));
    const chosen = [...shuf(all.filter(l => !axes.has(l))), ...shuf(all.filter(l => axes.has(l)))].slice(0, 3);
    const blanks = new Map(chosen.map((l, i) => [l, i + 1]));
    const taken = new Set([...all, ...areaNames(d), ...[...areaNames(d)].map(n => Object.keys(NICE).find(k => NICE[k] === n)).filter(Boolean)]);
    const others = shuf(DIAGRAMS.filter(x => x.fam !== d.fam && x.u === d.u).flatMap(x => DG.labels(x))).filter(l => !taken.has(l) && !/^[A-Z]_?[0-9]$/.test(l));
    const decoy = others[0];
    const toks = shuf(decoy ? [...chosen, decoy] : chosen);
    const fills = {}; let active = 1, state = null;
    $('#prompt').innerHTML = `${eyebrow(d.hl ? '<span class="chip hl">HL</span>' : '')}<h2>${H(d.t)}</h2><p class="how">Drag each label onto its blank, or tap a blank and then a label. One label doesn’t belong.</p>`;
    const paint = () => {
      $('#board').innerHTML = DG.render(d, { blanks, fills, state, active: state ? null : active, noCaps: true });
      if (state) return;
      $$('#board [data-slot]').forEach(g => {
        const n = +g.dataset.slot;
        g.onclick = () => { active = n; paint(); };
        g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); active = n; paint(); } };
      });
    };
    const used = () => new Set(Object.values(fills));
    const place = (n, tok) => {
      for (const k of Object.keys(fills)) if (fills[k] === tok) delete fills[k];
      fills[n] = tok;
      const empty = [1, 2, 3].slice(0, chosen.length).find(k => !fills[k]); if (empty) active = empty;
      paint(); ctrl();
    };
    const ctrl = () => {
      const u = used();
      $('#ctrl').innerHTML = `<div class="chips">${toks.map((t, i) => `<button type="button" class="tok${u.has(t) ? ' used' : ''}" data-t="${i}">${H(t)}</button>`).join('')}</div>
        <div class="row"><button type="button" class="btn" id="lock" ${Object.keys(fills).length === chosen.length ? '' : 'disabled'}>Lock it in</button><button type="button" class="btn ghost" id="clr">Clear</button></div>`;
      $$('.tok').forEach(b => b.onpointerdown = e => dragTok(e, b, toks[+b.dataset.t]));
      $('#lock').onclick = lock;
      $('#clr').onclick = () => { for (const k of Object.keys(fills)) delete fills[k]; active = 1; paint(); ctrl(); };
    };
    // drag a label chip; a press without movement counts as a tap on the active blank
    const dragTok = (e, el, tok) => {
      if (G.round.done) return;
      e.preventDefault();
      const sx = e.clientX, sy = e.clientY; let ghost = null, over = null;
      const slotAt = (x, y) => { const t = document.elementFromPoint(x, y); return t && t.closest && t.closest('#board [data-slot]'); };
      const move = ev => {
        if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) { ghost = el.cloneNode(true); ghost.classList.add('ghost-tok'); ghost.classList.remove('used'); document.body.appendChild(ghost); }
        if (!ghost) return;
        ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
        const s = slotAt(ev.clientX, ev.clientY);
        if (s !== over) { over && over.classList.remove('hover'); over = s; over && over.classList.add('hover'); }
      };
      const up = ev => {
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
        if (ghost) { ghost.remove(); const s = slotAt(ev.clientX, ev.clientY); if (s) place(+s.dataset.slot, tok); }
        else place(active, tok);
      };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    };
    const finish = timeout => {
      state = {}; let n = 0;
      for (const [l, k] of blanks) { const ok = fills[k] === l; state[k] = ok ? 'ok' : 'bad'; if (ok) n++; if (!ok) fills[k] = l; }
      paint();
      const ok = !timeout && n === chosen.length;
      resolve(ok, { timeout, title: ok ? 'All labels correct.' : `${timeout ? 'Out of time.' : `${n} of ${chosen.length} right.`} Red blanks now show the correct label.`, body: decoy ? `The decoy was “${H(decoy)}”.` : '', tip: H(d.tip), missed: d });
    };
    const lock = () => { if (Object.keys(fills).length === chosen.length && !G.round.done) finish(false); };
    G.round.timeout = () => finish(true);
    paint(); ctrl();
    keys = k => {
      if (/^[1-9]$/.test(k) && toks[+k - 1]) place(active, toks[+k - 1]);
      else if (k === 'Enter') lock();
    };
  }

  /* ======================= ROUND: HUNT THE AREA ======================= */
  function rHunt() {
    const d = fresh(huntPool(), x => x.id), names = [...areaNames(d)], target = any(names);
    const map = []; let i = 0;
    const hide = new Set([...names, ...names.map(n => Object.keys(NICE).find(k => NICE[k] === n)).filter(Boolean)]);
    // smallest areas first: the engine stacks earlier areas on top, so a triangle inside a rectangle stays tappable
    const size = e => Math.abs(e.pts.reduce((a, p, k) => { const q = e.pts[(k + 1) % e.pts.length]; return a + p[0] * q[1] - q[0] * p[1]; }, 0));
    const dd = { ...d, panels: d.panels.map(p => {
      const els = p.els.filter(e => !((e.k === 'text' || e.k === 'box') && hide.has(e.s)));
      const areas = els.filter(e => e.k === 'area').sort((a, b) => size(a) - size(b)).map(e => (map.push(areaName(e)), { ...e, lab: null, c: 'h' + (i++) }));
      return { ...p, els: [...areas, ...els.filter(e => e.k !== 'area')] };
    }) };
    $('#prompt').innerHTML = `${eyebrow(d.hl ? '<span class="chip hl">HL</span>' : '')}<p class="ctx">${H(d.t)}</p><h2>Tap the <span class="target">${H(target.toLowerCase())}</span>.</h2>`;
    const board = $('#board'); board.classList.add('hunt');
    board.innerHTML = DG.render(dd, { noCaps: true });
    const done = (ok, timeout) => {
      board.classList.remove('hunt'); board.innerHTML = DG.render(d);
      resolve(ok, { timeout, title: ok ? `That’s the ${H(target.toLowerCase())}.` : `The ${H(target.toLowerCase())} is now shaded and labelled.`, tip: H(d.tip), missed: d });
    };
    board.onclick = e => {
      if (G.round.done) return;
      const p = e.target.closest && e.target.closest('path.ar'); if (!p) return;
      const m = /a-h(\d+)/.exec(p.getAttribute('class')); if (!m) return;
      done(map[+m[1]] === target, false);
    };
    G.round.timeout = () => done(false, true);
    keys = null;
  }

  /* ======================= ROUND: NUMBER CRUNCH (HL) ======================= */
  function rCalc() {
    const c = fresh(calcPool(), x => x.id), g = c.gen();
    $('#prompt').innerHTML = `${eyebrow('<span class="chip hl">HL · AO4</span>')}<h2>${H(c.t)}</h2><p class="calcp">${g.prompt}</p>`;
    $('#board').innerHTML = g.panel ? DG.render({ panels: [g.panel] }) : '<p class="how" style="padding:40px 12px">No diagram for this one. Work it out on paper.</p>';
    $('#ctrl').innerHTML = `<form id="cf" class="row"><label class="flab" for="num">Answer${g.unit ? ' (' + g.unit + ')' : ''}</label><input class="num" id="num" inputmode="decimal" autocomplete="off" placeholder="e.g. 12.5"><button class="btn" type="submit">Lock it in</button></form><p class="how" id="cmsg"></p>`;
    const reveal = () => { if (g.panel && g.post) $('#board').innerHTML = DG.render({ panels: [{ ...g.panel, els: [...g.panel.els, ...g.post] }] }); };
    const show = v => +(+v).toFixed(2) + (g.unit && g.unit !== '$' ? ' ' + g.unit : '');
    $('#cf').onsubmit = e => {
      e.preventDefault(); if (G.round.done) return;
      const v = parseFloat($('#num').value.replace(/[$,€%\s]/g, '').replace('−', '-'));
      if (Number.isNaN(v)) { $('#cmsg').textContent = 'Type a number, for example 37.5 or −120.'; return; }
      const ok = Math.abs(v - g.ans) <= Math.max(g.tol || 0.005, Math.abs(g.ans) * 0.005);
      reveal(); resolve(ok, { title: ok ? `Correct: ${show(g.ans)}.` : `The answer is ${show(g.ans)}.`, body: `<span class="work">${g.work}</span>` });
    };
    G.round.timeout = () => { reveal(); resolve(false, { timeout: true, title: `The answer is ${show(g.ans)}.`, body: `<span class="work">${g.work}</span>` }); };
    setTimeout(() => $('#num') && $('#num').focus({ preventScroll: true }), 60);
    keys = null;
  }

  /* ---------- GAME OVER ---------- */
  function over() {
    if (!G) return home();
    stopTimer(); const unfinished = G.round && !G.round.done; if (G.round) G.round.done = true;
    const key = bestKey(G.world.id, G.types), prev = store.get(key, 0), isBest = G.score > prev;
    if (isBest) store.set(key, G.score);
    const n = starsFor(G.score), answered = G.rounds - (unfinished ? 1 : 0);
    const acc = answered ? Math.round(100 * G.right / answered) : 0;
    const missed = [...G.missed.values()];
    $('#hud').hidden = true;
    $('#main').innerHTML = `<section class="over">
      <div><p class="eyebrow"><span class="rt">${mixName(G.types, G.level)} · ${G.world.name} · ${G.level}</span></p>
        <h1>${G.lives <= 0 ? 'Game over' : 'Run ended'}</h1></div>
      <div class="row">${isBest && G.score ? '<span class="newbest">New best!</span>' : ''}<span class="stars" aria-label="${n} of 3 stars">${[0, 1, 2].map(i => starSvg(i < n)).join('')}</span></div>
      <div class="tally">
        <div><small>Score</small><b>${G.score.toLocaleString('en-US')}</b></div>
        <div><small>Best</small><b>${Math.max(prev, G.score).toLocaleString('en-US')}</b></div>
        <div><small>Correct</small><b>${G.right}/${answered}</b></div>
        <div><small>Accuracy</small><b>${acc}%</b></div>
        <div><small>Top streak</small><b>${G.top}</b></div>
        <div><small>Level</small><b>${G.lvl}</b></div>
      </div>
      ${missed.length ? `<div class="review"><h2>Revise these diagrams</h2><ul>${missed.map(d => `<li><b>${H(d.t)}</b><span>${H(d.tip)}</span></li>`).join('')}</ul></div>` : ''}
      <div class="row"><button type="button" class="btn" id="again">Play ${G.world.name} again</button><button type="button" class="btn ghost" id="home">Change rounds or world</button></div>
    </section>`;
    const w = G.world; G = null;
    $('#again').onclick = () => start(w); $('#home').onclick = home; $('#again').focus({ preventScroll: true });
    keys = k => { if (k === 'Enter') start(w); };
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.addEventListener('keydown', e => {
    if (!keys || e.target.matches('input, textarea')) return;
    if (e.target.matches('button') && (e.key === 'Enter' || e.key === ' ')) return;   // let the focused button act
    keys(e.key);
  });
  home();
})();

</script>
</body>
</html>
